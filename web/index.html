<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Reconhecimento de gestos com as mãos e expressões faciais em tempo real."
    />
    <title>Expression Scanner Meme</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #f4f4f5;
        background: #18181b;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
      }

      main {
        width: min(100% - 32px, 1200px);
        margin: 0 auto;
        padding: 32px 0;
      }

      h1 {
        margin: 0 0 8px;
      }

      .intro {
        margin: 0 0 20px;
        color: #d4d4d8;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }

      button {
        border: 0;
        border-radius: 6px;
        padding: 11px 16px;
        color: #fff;
        background: #2563eb;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      #status {
        min-height: 1.5em;
        color: #d4d4d8;
      }

      #status[data-type="error"] {
        color: #fca5a5;
      }

      #status[data-type="success"] {
        color: #86efac;
      }

      .panels {
        display: grid;
        grid-template-columns: minmax(0, 640px) minmax(0, var(--meme-width));
        align-items: start;
        gap: 20px;
      }

      .panel {
        min-width: 0;
      }

      .panel h2 {
        margin: 0 0 10px;
        font-size: 1rem;
      }

      .camera-frame,
      .meme-frame {
        position: relative;
        overflow: hidden;
        background: #000;
      }

      .camera-frame {
        width: 100%;
        aspect-ratio: 4 / 3;
      }

      #video,
      #canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      #video {
        object-fit: fill;
      }

      #canvas {
        pointer-events: none;
      }

      .meme-frame {
        width: min(100%, var(--meme-width));
        aspect-ratio: 1;
        display: grid;
        place-items: center;
      }

      #meme {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      @media (max-width: 900px) {
        .panels {
          grid-template-columns: minmax(0, 1fr) minmax(0, 0.75fr);
        }
      }

      @media (max-width: 640px) {
        main {
          width: min(100% - 24px, 480px);
          padding-top: 24px;
        }

        .panels {
          grid-template-columns: 1fr;
        }

        .meme-frame {
          width: min(100%, var(--meme-width));
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Expression Scanner Meme</h1>
      <p class="intro">
        Reconhecimento de gestos com as mãos e expressões faciais pela webcam.
      </p>
      <div class="controls">
        <button id="start-camera" type="button" disabled>Iniciar câmera</button>
        <div id="status" role="status" aria-live="polite">Carregando imagens…</div>
      </div>
      <section class="panels" aria-label="Câmera e imagem do gesto">
        <div class="panel">
          <h2>Câmera</h2>
          <div class="camera-frame">
            <video id="video" muted playsinline></video>
            <canvas id="canvas" aria-label="Landmarks e gesto reconhecido"></canvas>
          </div>
        </div>
        <div class="panel">
          <h2>Imagem do gesto</h2>
          <div class="meme-frame">
            <img id="meme" alt="Imagem do gesto reconhecido" />
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
